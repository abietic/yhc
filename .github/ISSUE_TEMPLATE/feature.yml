name: Feature request
description: Propose a user problem and an observable YHC outcome.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, API keys, access tokens, private repository
        content, or other secrets. Keep source or reference claims factual and
        link only to public material you may disclose.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the user outcome and why current behavior is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed observable behavior
      description: Describe success, boundaries, and compatibility expectations.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Provenance or reference evidence
      description: Identify public sources, independent reasoning, or state that none is needed.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Acceptance and verification
      description: State focused acceptance checks or Makefile gates that would prove the outcome.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and private operational data from this request.
          required: true
