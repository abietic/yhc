version: "2"

run:
  go: "1.25"

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dupword
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - fatcontext
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - appendCombine
        - commentedOutCode
        - hugeParam
        - ifElseChain
        - rangeValCopy
        - sprintfQuotedString
    gosec:
      excludes:
        - G104
        - G112
        - G115
        - G204
        - G304
        - G306
        - G404
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: _test\.go
        linters:
          - dupword
          - errcheck
          - errorlint
          - fatcontext
          - gocritic
          - gosec
          - noctx
          - unparam
          - usestdlibvars
          - wastedassign
      - path: tools/
        text: "G204|G304"
        linters:
          - gosec
      - path: scripts/
        linters:
          - gocritic

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  new-from-merge-base: master
