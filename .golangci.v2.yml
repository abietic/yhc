version: "2"

run:
  go: "1.27"

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dupword
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - fatcontext
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - appendCombine
        - commentedOutCode
        - hugeParam
        - ifElseChain
        - rangeValCopy
        - sprintfQuotedString
    gosec:
      excludes:
        - G104
        - G112
        - G115
        - G204
        - G304
        - G306
        - G404
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        # Quick-fix diagnostics are style suggestions, not correctness gates.
        - -QF1001
        - -QF1003
        - -QF1008
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: _test\.go
        linters:
          - dupword
          - errcheck
          - errorlint
          - fatcontext
          - gocritic
          - gosec
          - noctx
          - unparam
          - usestdlibvars
          - wastedassign
      - path: tools/
        text: "G204|G304"
        linters:
          - gosec
      - path: scripts/
        linters:
          - gocritic
      # Go 1.27 requires golangci-lint v2.13+, whose newer analyzers surface
      # pre-existing findings outside this toolchain slice. Keep exceptions
      # narrow so the same rules still protect new paths.
      - path: ^engine/(compact/cache_boundary|messages/normalize)\.go$
        text: "G602"
        linters:
          - gosec
      - path: ^engine/hooks/shell\.go$
        text: "G118"
        linters:
          - gosec
      - path: ^engine/plugins/manager\.go$
        text: "G122"
        linters:
          - gosec
      - path: ^scripts/publication/
        text: "G702|G703"
        linters:
          - gosec
      - path: ^engine/context/claudemd\.go$
        text: "G703"
        linters:
          - gosec
      - path: ^tools/(edit|mailbox)\.go$
        text: "G703"
        linters:
          - gosec
      - path: ^engine/hooks/ssrf\.go$
        text: "LookupHost"
        linters:
          - noctx
      - path: ^scripts/migration_scan/main\.go$
        text: 'exec\.Command'
        linters:
          - noctx
      - path: ^tools/(glob|grep|lsp)\.go$
        text: 'exec\.Command'
        linters:
          - noctx
      - path: ^tools/worktree_manager\.go$
        text: 'exec\.Command'
        linters:
          - noctx
      - path: ^engine/provider/user_input_conversion_test\.go$
        text: "SA1019"
        linters:
          - staticcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
