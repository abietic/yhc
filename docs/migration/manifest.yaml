      notes: 'engine/tasks now has focused package tests for terminal status guards, AgentTask success/failure/cancel, DreamTask model execution, ShellTask success/failure output capture, output-file append/eviction, TaskManager submit/concurrency, StopTask kill semantics, and typed stop errors. Observable local/background Agent lifecycle state is covered for progress snapshots, bounded SDK-shaped task_progress query events for running local/background agents, one-shot terminal notification polling, main-thread task-notification queue bridging for completed/failed/killed local/background agent notifications, deterministic latest-wins SendMessage name routing, queueing, terminal rejection, AgentID propagation, bounded stopped/completed local-agent SendMessage auto-resume, pending-message reinjection into non-main-thread sub-agent query loops as FIFO queued_command attachments, and drained command_origin provenance for regular queue (sdk) and SendMessage/local-agent pending (coordinator) commands. Running-agent progress drains through AgentProgressDrainer/AgentRunner.PollAgentProgress into TaskProgressEvent without consuming terminal notifications and is now visible in the TUI running task tree with description plus last-tool/usage fallback and terminal cleanup coverage. Terminal notifications drain through AgentNotificationDrainer into Mode:"task-notification" meta task-origin queue commands and reuse the queued_command attachment path so the coordinator/model receives the <task-notification> XML envelope. Stopped/completed retained local agents resume with prior in-memory messages, evicted known local agents can resume from persisted bounded metadata/transcript by name or raw agent ID, post-resume sends queue FIFO to the running resumed agent, concurrent retained-agent sends start only one resumed execution, and missing/corrupt persisted evicted-agent data returns deterministic runner errors instead of task fallback. Known gaps: per-agent MCP lifecycle, transcript sidechain parity, file-state cache cloning, queued_command metadata beyond bounded provenance paths, SDK progress event coverage beyond bounded running-agent/task-list/AppState snapshots, periodic background summarization, foreground/background UI behavior, fork/remote/team parity, broad /resume UX, workflow/full task polling progress, and failure propagation remain incomplete.'
